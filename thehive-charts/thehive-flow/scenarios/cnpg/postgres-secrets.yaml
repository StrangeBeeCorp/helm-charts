################################################################################
# Passwords of the PostgreSQL roles used by TheHive Flow and the bundled Temporal
# Server. CloudNativePG creates the roles from these Secrets (spec.managed.roles
# in postgres-cluster.yaml); the TheHive Flow chart reads the `password` key.
# Change the passwords before any non-test use.
################################################################################
---
apiVersion: v1
kind: Secret
metadata:
  name: thehive-flow-postgresql-thehive-flow-user
  labels:
    # Let CloudNativePG reconcile the role when the password changes
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: thehive_flow
  password: ChangeThisPasswordForTheHiveFlow
---
apiVersion: v1
kind: Secret
metadata:
  name: thehive-flow-postgresql-temporal-user
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: temporal
  password: ChangeThisPasswordForTemporal
