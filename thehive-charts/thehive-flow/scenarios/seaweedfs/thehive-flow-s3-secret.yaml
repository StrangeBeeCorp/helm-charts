################################################################################
# S3 credentials of TheHive Flow, in the TheHive Flow namespace.
# Must match the identity in seaweedfs-s3-secret.yaml. The AWS-standard key names
# are required: the Codex kubernetes backend reuses this Secret.
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: thehive-flow-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: thehive-flow
  AWS_SECRET_ACCESS_KEY: ChangeThisPasswordForSeaweedFS
