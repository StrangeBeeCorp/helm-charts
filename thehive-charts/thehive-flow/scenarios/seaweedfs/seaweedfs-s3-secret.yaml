################################################################################
# S3 identity of TheHive Flow in SeaweedFS (referenced by
# allInOne.s3.existingConfigSecret in seaweedfs-values.yaml).
# The access and secret keys must match thehive-flow-s3-secret.yaml and
# blobstore.s3.accessKeyId in values.yaml. Change the secret key before any
# non-test use.
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "thehive-flow",
          "credentials": [
            {
              "accessKey": "thehive-flow",
              "secretKey": "ChangeThisPasswordForSeaweedFS"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
