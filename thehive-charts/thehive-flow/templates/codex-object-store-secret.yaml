{{- /*
Object-store credentials for the Codex Job namespace.

The Codex Job pods run in an isolated namespace (jobNamespace) and read
AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the object_store_secret via envFrom:
  - AWS_ACCESS_KEY_ID     = the non-secret blobstore.s3.accessKeyId (from values).
  - AWS_SECRET_ACCESS_KEY = read from the release-namespace S3 Secret under the
    operator-configurable secrets.s3SecretAccessKey.key, re-keyed to this AWS name.
Secrets are namespace-scoped, so that source Secret is not visible to the Job pods; we copy
the secret access key across via `lookup` rather than making the operator duplicate it.

`lookup` returns nothing during `helm template` / `--dry-run`, so this Secret only
materialises on a real install/upgrade, and only when the chart owns the namespace
(rbac.create), object_store_secret is at its default, AND static S3 credentials are in use
(blobstore.s3.accessKeyId set); with ambient credentials none is copied/referenced. A source
Secret that exists but lacks the configured key fails the render.

GitOps caveat: `lookup` is empty off-cluster, so Argo/Flux (which render via `helm template`)
will NOT get this Secret — for those, set codex.kubernetes.objectStoreSecret to a Secret you
provision in the Job namespace.
*/ -}}
{{- if and (eq .Values.codex.backend "kubernetes") .Values.codex.kubernetes.rbac.create (not .Values.codex.kubernetes.objectStoreSecret) .Values.blobstore.s3.accessKeyId }}
{{- $srcName := .Values.secrets.s3SecretAccessKey.existingSecret }}
{{- $srcKey := .Values.secrets.s3SecretAccessKey.key }}
{{- $src := lookup "v1" "Secret" .Release.Namespace $srcName }}
{{- if $src }}
{{- if not (hasKey ($src.data | default dict) $srcKey) }}
{{- fail (printf "Codex object-store copy: Secret %q in namespace %q has no key %q (secrets.s3SecretAccessKey.key) — the Codex assistant needs the S3 secret access key." $srcName .Release.Namespace $srcKey) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thehive-flow.codex.objectStoreSecret" . }}
  namespace: {{ include "thehive-flow.codex.jobNamespace" . }}
  labels:
    {{- include "thehive-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: codex-jobs
type: Opaque
data:
  # Secret access key, re-keyed from the configured source key to the AWS-standard name.
  AWS_SECRET_ACCESS_KEY: {{ index $src.data $srcKey }}
stringData:
  # Access key ID = the non-secret blobstore.s3.accessKeyId (same value TheHive Flow uses).
  AWS_ACCESS_KEY_ID: {{ .Values.blobstore.s3.accessKeyId | quote }}
{{- end }}
{{- end }}
