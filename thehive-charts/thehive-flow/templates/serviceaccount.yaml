{{/*
ServiceAccount for the TheHive Flow pod — a stable identity even though token
automount is off by default (blast-radius hardening):
  - the kubernetes Codex backend (the default) drives Jobs/pods/Secrets via an
    in-cluster client, so the Deployment forces the token on and codex-rbac binds
    this SA into the <release-namespace>-jobs namespace;
  - serviceAccount.annotations anchors IRSA / EKS Pod Identity for ambient S3
    credentials (no static keys).
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thehive-flow.serviceAccountName" . }}
  labels:
    {{- include "thehive-flow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end -}}
