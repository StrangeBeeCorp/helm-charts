image:
  # -- TheHive Flow container image repository.
  repository: docker.io/strangebee/thehive-flow
  # -- Image tag. Empty falls back to `.Chart.AppVersion`.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name portion of the fullname.
nameOverride: ""
# -- Override the entire fullname.
fullnameOverride: ""

# -- Replica count. v1 is single-replica only.
replicaCount: 1

# -- Explicit GOMEMLIMIT for the TheHive Flow container. Empty derives it from
# `resources.limits.memory` (see goMemLimitPercent). Only Go's binary suffixes are
# accepted — B, KiB, MiB, GiB, TiB, or a plain byte count. "900MB" is NOT one of
# them and makes the container exit at startup with
# `fatal error: malformed GOMEMLIMIT`.
goMemLimit: ""

# -- Percentage of `resources.limits.memory` used as GOMEMLIMIT when goMemLimit is
# empty. 0 leaves GOMEMLIMIT unset; anything at or above 100 fails the render (it
# would leave no margin at all). Go's GC does not read the cgroup ceiling on its own,
# so without a value the pod is OOMKilled with the collector still idle. The margin
# the percentage leaves must be at least 128 MiB in absolute terms — GOMEMLIMIT
# bounds runtime-managed memory only, so the mapped binary (90 MiB in the shipped
# image) and kernel-held memory come out of it, and that cost does not shrink with
# the limit. 85% of the default 1Gi leaves 154 MiB; on a 512Mi limit it would leave
# 77 MiB and the render fails, telling you to lower this value (75% fits).
goMemLimitPercent: 85

# -- Resource requests/limits for the TheHive Flow container. `limits.memory` is
# also what GOMEMLIMIT is derived from — raising it raises GOMEMLIMIT with it,
# unless goMemLimit pins an explicit value.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 256Mi
  limits:
    memory: 1Gi
    ephemeral-storage: 1Gi

# -- Pod-level securityContext. UID 65532 is the distroless nonroot user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level securityContext for the TheHive Flow container.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Grace period the kubelet grants the TheHive Flow pod on SIGTERM before
# SIGKILL. 30 is Kubernetes' own default, made explicit here because it is
# paired with an application setting: `shutdown.timeout` (20s by default, warned
# about above 25s) plus a separate ~5s telemetry flush. Raising `shutdown.timeout`
# past 25s means raising this too, or the drain is cut short by SIGKILL.
terminationGracePeriodSeconds: 30

# -- nodeSelector for the TheHive Flow pod.
nodeSelector: {}
# -- tolerations for the TheHive Flow pod.
tolerations: []
# -- affinity for the TheHive Flow pod.
affinity: {}

# -- Extra annotations on the TheHive Flow pod.
podAnnotations: {}
# -- Extra labels on the TheHive Flow pod.
podLabels: {}

serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Override the ServiceAccount name. Empty = generated from fullname.
  name: ""
  # -- Annotations on the ServiceAccount (e.g. eks.amazonaws.com/role-arn for IRSA).
  annotations: {}
  # -- Mount the ServiceAccount token into the pod. Forced on when
  # codex.backend is "kubernetes" (the TheHive Flow in-cluster k8s client needs the token).
  automountServiceAccountToken: false

service:
  api:
    # -- Service type for the REST API listener.
    type: ClusterIP
    # -- Service port for the REST API listener (container port 8081).
    port: 8081

# Observability listener (9090) is pod-level only; probes hit it directly.

probes:
  # -- Liveness probe spec.
  liveness:
    httpGet:
      path: /livez
      port: observability
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  # -- Readiness probe spec.
  readiness:
    httpGet:
      path: /readyz
      port: observability
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
  # -- Startup probe spec. Holds liveness/readiness until the app first serves
  # /livez, so a slow first boot (e.g. pod self-migration when the migration Job
  # is disabled) can't be killed by liveness. Set to {} to disable.
  startup:
    httpGet:
      path: /livez
      port: observability
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 60

migrations:
  # -- Enable the pre-install/pre-upgrade `beeflow migrate up` Job.
  enabled: true
  # -- Percentage of this Job's `resources.limits.memory` used as its GOMEMLIMIT.
  # 50, not the server's 85: the same 128 MiB of margin has to come out of a 256Mi
  # limit rather than 1Gi, so the percentage that satisfies it is necessarily lower.
  # Raise `resources.limits.memory` below if you need a higher share. 0 opts out.
  goMemLimitPercent: 50
  # -- Resource requests/limits for the migration Job's pod. `limits.memory` is also
  # what this Job's GOMEMLIMIT is derived from.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 256Mi
      ephemeral-storage: 256Mi

# Bundled Temporal Server (subchart temporalio/temporal 1.7.0). Values flow into the subchart.
temporal:
  # -- Toggle the Temporal subchart. False → use `externalTemporal` below.
  enabled: true

  server:
    config:
      persistence:
        # -- Temporal history shards. IMMUTABLE for the cluster's lifetime — it cannot be
        # changed after the first install without recreating Temporal's databases. 512 is a
        # sane production default (harmless for dev); lower it only for a throwaway cluster.
        numHistoryShards: 512
        # -- Datastore name used for workflow state.
        defaultStore: default
        # -- Datastore name used for the visibility store.
        visibilityStore: visibility

        datastores:
          default:
            sql:
              # -- Temporal SQL plugin (postgres12 works against any modern Postgres).
              pluginName: postgres12
              # -- Workflow-state database name.
              databaseName: temporal
              # -- Service of the external Postgres primary.
              connectAddr: "thehive-flow-postgresql-rw:5432"
              # -- Connection protocol.
              connectProtocol: tcp
              # -- Postgres role.
              user: temporal
              # -- Existing Secret holding the temporal user's password.
              existingSecret: thehive-flow-postgresql-temporal-user
              # -- Key inside the Secret.
              secretKey: password
              # -- Max open connections.
              maxConns: 20
              # -- Max idle connections.
              maxIdleConns: 20
              # -- Connection lifetime.
              maxConnLifetime: "1h"
          visibility:
            sql:
              # -- See default.sql.pluginName.
              pluginName: postgres12
              # -- Visibility-store database name.
              databaseName: temporal_visibility
              # -- Same primary as the default datastore.
              connectAddr: "thehive-flow-postgresql-rw:5432"
              # -- See default.sql.connectProtocol.
              connectProtocol: tcp
              # -- Same role.
              user: temporal
              # -- Same external Secret.
              existingSecret: thehive-flow-postgresql-temporal-user
              # -- Same Secret key.
              secretKey: password
              # -- Max open connections for visibility traffic.
              maxConns: 10
              # -- Max idle connections for visibility traffic.
              maxIdleConns: 10
              # -- Connection lifetime.
              maxConnLifetime: "1h"

      namespaces:
        # -- Auto-create the listed namespaces post-install (required by registerSearchAttributes).
        create: true
        # -- Create the namespaces with a plain Job rather than a post-install hook. Subchart 1.7.0
        # flipped this default to true, which deadlocks the install: the TheHive Flow Deployment's
        # wait-temporal init container blocks until the namespace exists, `helm install --wait`
        # blocks until that Deployment is Available, and a post-install hook only runs once that
        # wait returns. A plain Job runs alongside the Deployment, which is what 1.6.0 did.
        useHelmHooks: false
        # -- Namespaces to auto-create.
        namespace:
          # -- Namespace name.
          - name: default
            # -- Workflow execution retention.
            retention: 168h

    # Without requests these pods are BestEffort and get evicted before TheHive Flow.
    # CPU requests but no CPU limits, as everywhere else in this file.
    frontend:
      # -- Resource requests/limits for the frontend.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    history:
      # -- Resource requests/limits for the history service. Largest share: it caches
      # workflow histories across `numHistoryShards`.
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
    matching:
      # -- Resource requests/limits for the matching service.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    worker:
      # -- Resource requests/limits for the system worker.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

  schema:
    # -- Run schema-init as a pre-install/pre-upgrade hook (avoids first-install server crashloops).
    useHelmHooks: true

  # -- Disable the bundled Temporal Web UI.
  web:
    enabled: false

  admintools:
    # -- Resource requests/limits for the admin-tools pod (ops CLI, mostly idle).
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

externalTemporal:
  # -- External Temporal frontend host. Only used when `temporal.enabled: false`. Must be a plaintext,
  # unauthenticated Temporal frontend reachable in-cluster or over a private network (VPC/peering):
  # TLS/mTLS and API keys are not supported, so Temporal Cloud will not work.
  host: ""
  # -- External Temporal frontend port.
  port: 7233

# The wait-temporal init container blocks TheHive Flow startup until Temporal is
# genuinely ready — it polls `temporal operator namespace describe` until the
# namespace exists, which is true only once the frontend is serving AND the
# namespace-register Job has created it.
temporalReadiness:
  # -- Gate the wait-temporal init container. Disable to skip the readiness wait when Temporal is
  # already ready or reachable by other means.
  enabled: true
  image:
    # -- Admin-tools image (ships the `temporal` CLI). Pin to match your Temporal server version.
    repository: docker.io/temporalio/admin-tools
    # -- Image tag.
    tag: "1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83"
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- Temporal namespace to wait for (the namespace TheHive Flow uses).
  namespace: default
  # -- Resource requests/limits for the wait-temporal init container.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 64Mi
      ephemeral-storage: 32Mi

# The wait-postgres (Deployment and migration Job) and wait-docker-socket-proxy init
# containers.
waitContainers:
  image:
    # -- Image repository (needs `sh` and `nc`). Repoint it for air-gapped or private registries.
    repository: docker.io/library/busybox
    # -- Image tag.
    tag: "1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- Resource requests/limits for these init containers (`nc` peaks at ~4 MiB).
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 32Mi
      ephemeral-storage: 32Mi

postgresql:
  # -- CNPG read-write Service of the external Postgres primary. When temporal.enabled,
  # this must match temporal.server.config.persistence.datastores.{default,visibility}.sql.connectAddr
  # (the bundled Temporal shares this Postgres); the chart fails the render if they diverge.
  host: thehive-flow-postgresql-rw
  # -- Postgres port.
  port: 5432
  # -- Postgres role used by the TheHive Flow binary.
  username: thehive_flow
  # -- Database name (created by the external Database).
  database: thehive_flow
  # -- SSL mode for the Postgres connection. Defaults to `require` (encrypts in-transit). For the strongest
  # guarantee use `verify-full` and supply the server CA to the client (sslrootcert).
  sslMode: require

# Blob store. Playbook/webhook file references are stored here. An S3-compatible
# object store is a prerequisite, installed separately — see
# scenarios/seaweedfs/.
blobstore:
  # -- Backend: "s3" (durable). "memory" is unit-test-only and rejected at startup (the chart fails the render).
  backend: s3
  s3:
    # -- Bucket for blobs.
    bucket: thehive-flow
    # -- Region. Some gateways ignore it, but the AWS SDK requires a value.
    region: us-east-1
    # -- S3 endpoint URL. Empty for AWS S3 (SDK resolves it); set to your S3-compatible endpoint otherwise.
    # Default targets the bundled SeaweedFS in `soar`; set it for another namespace or store. Must be a
    # cross-namespace FQDN when codex.backend: kubernetes — it is passed verbatim to the assistant containers,
    # which run in jobNamespace and cannot resolve a bare Service name.
    endpoint: http://s3-store-all-in-one.soar.svc.cluster.local:8333  # NOSONAR S5332 — in-cluster bundled SeaweedFS (http); override with https in production.
    # -- Path-style addressing. true for most S3-compatible gateways; false for AWS S3 (virtual-hosted).
    usePathStyle: true
    # -- Access key ID (static creds). Empty → AWS SDK default chain (IRSA / Pod Identity). For the bundled
    # SeaweedFS, must match its admin.accessKey and the bootstrap Secret's AWS_ACCESS_KEY_ID.
    accessKeyId: thehive-flow

secrets:
  jwtSymmetricKey:
    # -- Existing Secret holding the JWT signing key; at least 32 bytes or TheHive Flow refuses to start.
    existingSecret: thehive-flow-jwt
    # -- Key inside the Secret.
    key: jwt-symmetric-key
  databasePassword:
    # -- Existing Secret holding the TheHive Flow Postgres user's password.
    existingSecret: thehive-flow-postgresql-thehive-flow-user
    # -- Key inside the Secret.
    key: password
  thehiveApiKey:
    # -- Existing Secret holding the TheHive API key.
    existingSecret: thehive-flow-thehive
    # -- Key inside the Secret.
    key: api-key
  s3SecretAccessKey:
    # -- Existing Secret holding the S3 secret access key (blobstore.backend: s3).
    # The same Secret is reused by the Codex kubernetes backend (object_store_secret),
    # so it carries AWS-standard keys (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
    existingSecret: thehive-flow-s3
    # -- Key inside the Secret holding the S3 secret access key.
    key: AWS_SECRET_ACCESS_KEY
  mailerPassword:
    # -- Existing Secret holding the SMTP password of config.modules.workers.activities.mailer.
    # Required when mailer.user is set, refused without it.
    existingSecret: ""
    # -- Key inside the Secret.
    key: password

# TheHive Flow configuration (rendered into a ConfigMap at /thehive-flow.yml).
config:
  api:
    public:
      # -- Enable the REST API listener.
      enable: true
      # -- Bind address for the REST API listener.
      addr: "0.0.0.0:8081"
      # -- Required when enable is true. Public URL: absolute http(s), no credentials, query or fragment; webhook responses carry `<url>/webhook/<id>`.
      url: ""
      # -- Trusted proxy CIDRs: for a request from one of them, the webhook rate limit (`rate_limit_per_minute`) reads the client from X-Forwarded-For.
      # A malformed CIDR (including a bare IP), an IPv4-mapped CIDR or a /0 fails startup.
      # A range that also holds clients lets them bypass that limit, as the pod CIDR does behind an in-cluster ingress. A trusted proxy must append the address of its own peer to X-Forwarded-For.
      trusted_proxies: []

  modules:
    observability:
      listener:
        # -- Bind address for the observability listener (livez/readyz/metrics).
        addr: "0.0.0.0:9090"
      metrics:
        prometheus:
          # -- Expose Prometheus metrics on the observability listener.
          enabled: true
      pprof:
        # -- Expose pprof endpoints on the observability listener.
        enabled: false

    workers:
      activities:
        http:
          # -- Log every HTTP activity request.
          request_logging: false
        thehive:
          # -- TheHive URL (assumes a Service named `thehive` in the namespace).
          url: http://thehive:9000
        # SMTP configuration of the mailer activity, used instead of the one TheHive pushes.
        mailer:
          # -- SMTP server. Empty keeps the configuration pushed by TheHive; set, it overrides it.
          host: ""
          # -- SMTP port, 1–65535.
          port: 587
          # -- STARTTLS, the only TLS the mailer speaks (no implicit TLS, so not port 465).
          # Required to send credentials to a non-loopback host.
          tls: true
          # -- SMTP username. Its password comes from secrets.mailerPassword.
          user: ""
          # -- Default sender address.
          from: ""
        egress:
          # -- Outbound connections from workflow nodes (http, integration,
          # llm.chat) are guarded against SSRF: non-public addresses (loopback,
          # RFC1918, link-local, CGNAT, reserved) are blocked at dial time with
          # "egress guard: outbound connection to non-public address blocked".
          # To reach a legitimate internal target (TheHive or Cortex on a private
          # network, a locally hosted LLM provider), allowlist its CIDR range.
          # A malformed CIDR (including a bare IP without prefix) fails startup.
          allowlist: []
          # allowlist:
          #   - 192.168.1.0/24    # a subnet
          #   - 192.168.1.10/32   # a single host

    runs:
      # -- Run retention. TheHive Flow is the source of truth for retention.
      retention: 168h
      # -- Sync the Temporal namespace retention to runs.retention (TheHive Flow becomes the
      # source of truth). Null (default) follows temporal.enabled — on for the bundled Temporal, off
      # for an external one: rewriting the retention of a namespace owned by another team
      # would silently delete their workflow histories. Set true/false to force.
      syncTemporalRetention: null

observability:
  otlp:
    # -- OTLP exporter endpoint (e.g. http://otel-collector:4317).
    endpoint: ""
    # -- OTLP protocol — grpc or http/protobuf.
    protocol: ""
    # -- OTLP exporter headers (comma-separated key=value).
    headers: ""
    # -- Resource attributes for emitted spans/metrics (comma-separated key=value).
    resourceAttributes: ""

codex:
  # -- Execution backend for Codex scripts: "kubernetes" (default; each script runs as an
  # isolated Job) or "docker" (needs a Docker socket — see dockerSocketProxy / codex.dockerHost).
  backend: kubernetes

  # -- DOCKER_HOST for the docker backend. Empty + dockerSocketProxy.enabled auto-wires the proxy.
  # Ignored when backend is kubernetes.
  dockerHost: ""

  # -- Override the container image for built-in Codex languages, keyed by
  # language name (e.g. "python@v3_11", "javascript@v24"). Point these at your internal registry
  # for air-gapped / proxied clusters that cannot reach the default gcr.io images. Empty uses the
  # built-in defaults. Applies to both backends (kubernetes and docker).
  languageImages: {}

  # Kubernetes backend. Each Codex script runs as a Job in a dedicated, isolated namespace so
  # untrusted user code never shares TheHive Flow's namespace or ServiceAccount.
  kubernetes:
    # -- Namespace for Codex Jobs. Empty defaults to "<release-namespace>-jobs".
    jobNamespace: ""

    rbac:
      # -- Create the Job namespace, the codex-jobs ServiceAccount, and the Roles/RoleBindings
      # (thehive-flow → drive Jobs; codex-jobs → patch own pod). Disable to manage them yourself.
      create: true

    # -- ServiceAccount the Job pods run as (created when rbac.create).
    serviceAccount: codex-jobs
    # -- Annotations on the codex-jobs ServiceAccount (e.g. eks.amazonaws.com/role-arn for IRSA),
    # so Codex Jobs can use ambient S3 credentials (AWS SDK default chain) when objectStoreSecret is unset.
    serviceAccountAnnotations: {}

    assistantImage:
      # -- Assistant init/sidecar image repository (moves blobs between S3 and the Job work dir).
      repository: docker.io/strangebee/thehive-flow-assistant
      # -- Image tag. Empty falls back to .Chart.AppVersion.
      tag: ""

    # -- imagePullSecrets (existing Secret names) for the assistant + language images.
    # These Secrets must exist in the Job namespace (jobNamespace), which is separate
    # from the release namespace — imagePullSecrets are namespace-scoped.
    imagePullSecrets: []

    # -- Existing Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the assistant's static S3
    # access, resolved in the Job namespace (jobNamespace). Behaviour when empty:
    #   - static credentials (blobstore.s3.accessKeyId set): defaults to the blobstore Secret name
    #     (secrets.s3SecretAccessKey.existingSecret), copied into the Job namespace when rbac.create;
    #   - ambient credentials (accessKeyId unset): omitted entirely, so the assistant uses the AWS SDK
    #     default credential chain via serviceAccountAnnotations (IRSA / Pod Identity).
    # A custom name must be provisioned in the Job namespace yourself.
    objectStoreSecret: ""

    # -- Default CPU/memory requests+limits for the user (script) container.
    resources: {}

    # -- Auto-delete finished Jobs after N seconds (0 → backend default).
    ttlSecondsAfterFinished: 0
    # -- Cap a Job's total run time in seconds (0 → backend default).
    activeDeadlineSeconds: 0
    # -- Pod terminationGracePeriodSeconds for output promotion (0 → backend default).
    gracePeriodSeconds: 0
    # -- Cap the shared work-dir emptyDir (e.g. "1Gi"); empty = uncapped.
    ephemeralStorage: ""
    # -- nodeSelector for Job pods, as "key=value" strings.
    nodeSelector: []

# Embedded docker-socket-proxy (dev/test only; needs a node running Docker — kind, Docker Desktop).
# Only used by the docker backend. Production clusters (containerd/CRI-O) have no Docker socket.
dockerSocketProxy:
  # -- Deploy the embedded docker-socket-proxy. Off by default.
  enabled: false

  image:
    # -- Container image repository for the docker socket proxy.
    repository: docker.io/tecnativa/docker-socket-proxy
    # -- Image tag.
    tag: v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # -- Image pull policy.
    pullPolicy: IfNotPresent

  # -- Docker API verbs the proxy forwards (1 = allow, 0 = deny).
  permissions:
    CONTAINERS: 1
    IMAGES: 1
    NETWORKS: 1
    VOLUMES: 1
    INFO: 1
    POST: 1

  service:
    # -- Service type for the proxy.
    type: ClusterIP
    # -- Service port (and container port).
    port: 2375

  # -- Path to the Docker socket on the node, hostPath-mounted read-only into the proxy.
  hostSocketPath: /var/run/docker.sock

  # -- Resource requests/limits for the proxy pod.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Helm test — `helm test <release>`
tests:
  image:
    # -- Image used by the `helm test` probe pod (needs curl).
    repository: docker.io/curlimages/curl
    # -- Image tag.
    tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"
    # -- Image pull policy.
    pullPolicy: IfNotPresent
