{{- if and (include "thehive.flow.bundled" .) (not .Values.thehive.flow.k8sSecretName) }}
{{- $secretName := include "thehive.flow.jwtSecretName" . }}
{{- $secretKey := include "thehive.flow.jwtSecretKey" . }}
{{- $signingKey := .Values.thehive.flow.signingKey }}
{{- if not $signingKey }}
  {{- /* Keep the generated key across upgrades: TheHive Flow tokens are signed with it */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- $signingKey = dig "data" $secretKey "" $existing | b64dec | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # The TheHive Flow migrations Job (pre-install/pre-upgrade hook, weight -1) reads this secret:
    # create it first. As a hook resource, it is kept on uninstall
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.thehive.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "thehive.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $secretKey }}: {{ $signingKey | b64enc | quote }}
{{- end }}
