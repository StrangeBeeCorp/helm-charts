################################################################################
# TheHive with SeaweedFS Object Storage
################################################################################
# See README.md for deployment instructions

thehive:
  storage:
    accessKey: "seaweedfs-admin"

    # S3 Secret Key - Using Kubernetes Secret (recommended)
    # The secret is created by thehive-s3-credentials.yaml
    k8sSecretName: "thehive-s3-credentials"
    k8sSecretKey: "secretKey"

    endpoint: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
    bucket: "thehive"
    region: "us-east-1"
    usePathAccessStyle: true

# Disable MinIO subchart (using external SeaweedFS instead)
minio:
  enabled: false

# Minimal resources for Kind cluster compatibility
# JVM heaps must stay below the memory limits, or the containers are OOMKilled
cassandra:
  resourcesPreset: none
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1536Mi
  jvm:
    extraOpts: "-Xms768m -Xmx768m -Xmn128m"
    maxHeapSize: "768m"
    newHeapSize: "128m"

elasticsearch:
  master:
    resourcesPreset: none
    heapSize: "512m"
    extraEnvVars:
      - name: JVM_OPTS
        value: "-Xms512m -Xmx512m"
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 1536Mi
