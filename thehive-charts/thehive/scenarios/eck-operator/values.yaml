################################################################################
# TheHive with ECK Operator
################################################################################
# Deployment steps: https://docs.strangebee.com/thehive/installation/kubernetes/

thehive:
  index:
    # The elastic superuser keeps this example simple. In production, create a
    # dedicated user with access limited to the TheHive indices.
    username: "elastic"
    k8sSecretName: "elasticsearch-credentials"
    k8sSecretKey: "password"
    hostnames:
      - "elasticsearch-es-http.elastic-system.svc.cluster.local"
  initContainers:
    checkElasticsearch:
      useHttps: false

# Disable Bitnami Elasticsearch subchart (using ECK operator instead)
elasticsearch:
  enabled: false
