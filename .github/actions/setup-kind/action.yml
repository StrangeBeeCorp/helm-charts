name: Set up Helm and Kind
description: Install the latest Helm, create a Kind cluster and print its nodes

inputs:
  cluster-name:
    description: Name of the Kind cluster
    required: true
  k8s-version:
    description: Kubernetes version of the kindest/node image (e.g. v1.36.4)
    required: true

runs:
  using: composite
  steps:
    - name: Install Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: "latest"

    - name: Create Kind cluster
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        cluster_name: ${{ inputs.cluster-name }}
        node_image: kindest/node:${{ inputs.k8s-version }}
        wait: 300s

    - name: Verify cluster
      shell: bash
      run: |
        kubectl cluster-info
        kubectl get nodes
