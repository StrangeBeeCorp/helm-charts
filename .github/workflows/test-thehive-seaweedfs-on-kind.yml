name: TheHive on Kind - SeaweedFS

on:
  pull_request:
    branches:
      - main
    paths:
      - "thehive-charts/thehive/**"
      - "!thehive-charts/thehive/**/*.md"
      - "!thehive-charts/thehive/**/README.md.gotmpl"
      - ".github/workflows/test-thehive-seaweedfs-on-kind.yml"
      - ".github/actions/setup-kind/**"
  push:
    branches:
      - main
    paths:
      - "thehive-charts/thehive/**"
      - "!thehive-charts/thehive/**/*.md"
      - "!thehive-charts/thehive/**/README.md.gotmpl"
      - ".github/workflows/test-thehive-seaweedfs-on-kind.yml"
      - ".github/actions/setup-kind/**"

jobs:
  test:
    name: Install and Test TheHive Chart with SeaweedFS
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        k8s-version:
          - v1.36.4
          - v1.35.8
    env:
      SCENARIO: thehive-charts/thehive/scenarios/seaweedfs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm and Kind
        uses: ./.github/actions/setup-kind
        with:
          cluster-name: thehive-seaweedfs-test
          k8s-version: ${{ matrix.k8s-version }}

      - name: Install object storage (SeaweedFS)
        run: |
          kubectl create namespace seaweedfs
          kubectl apply -f "$SCENARIO/seaweedfs-s3-secret.yaml"

          helm upgrade --install seaweedfs seaweedfs \
            --repo https://seaweedfs.github.io/seaweedfs/helm --version 4.48.0 \
            -n seaweedfs -f "$SCENARIO/seaweedfs-values.yaml" \
            --timeout 5m --wait

      - name: Verify SeaweedFS deployment
        run: |
          echo "=== SeaweedFS Pods ==="
          kubectl get pods -n seaweedfs
          echo ""
          echo "=== SeaweedFS Services ==="
          kubectl get svc -n seaweedfs

      - name: Create TheHive namespace and S3 credentials secret
        run: |
          kubectl create namespace thehive

          S3_CONFIG=$(kubectl get secret seaweedfs-s3-config -n seaweedfs \
            -o jsonpath='{.data.seaweedfs_s3_config}' | base64 -d)

          kubectl create secret generic thehive-s3-credentials -n thehive \
            --from-literal=accessKey="$(jq -r '.identities[0].credentials[0].accessKey' <<<"$S3_CONFIG")" \
            --from-literal=secretKey="$(jq -r '.identities[0].credentials[0].secretKey' <<<"$S3_CONFIG")"

      - name: Update Helm dependencies
        working-directory: thehive-charts/thehive
        run: helm dependency update

      - name: Install TheHive chart
        working-directory: thehive-charts/thehive
        run: |
          SECRET=$(openssl rand -base64 32)

          helm install thehive . \
            --namespace thehive \
            --values scenarios/seaweedfs/values.yaml \
            --set thehive.httpSecret="$SECRET" \
            --timeout=15m \
            --wait

      - name: Check initial pod status
        run: |
          echo "=== All Pods ==="
          kubectl get pods -n thehive
          echo ""
          echo "=== Pod Details ==="
          kubectl describe pods -n thehive

      - name: Wait for dependencies to be ready
        run: |
          kubectl wait --for=condition=ready --timeout=10m \
            --namespace thehive \
            pod -l app.kubernetes.io/name=cassandra

          kubectl wait --for=condition=ready --timeout=10m \
            --namespace thehive \
            pod -l app.kubernetes.io/name=elasticsearch

      - name: Wait for TheHive to be ready
        run: |
          kubectl wait --for=condition=available --timeout=10m \
            --namespace thehive \
            deployment -l app.kubernetes.io/name=thehive

      - name: Check deployment status
        run: |
          kubectl get pods -n thehive
          kubectl get deployments -n thehive
          kubectl get services -n thehive

      - name: Run Helm tests
        run: helm test thehive --namespace thehive --timeout=5m --logs

      - name: Run smoke tests
        run: bash thehive-charts/thehive/tools/test/smoke.sh

      - name: Run storage tests
        run: bash thehive-charts/thehive/tools/test/storage.sh

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== All Pods Status ==="
          kubectl get pods -n seaweedfs -o wide
          kubectl get pods -n thehive -o wide
          echo ""
          echo "=== Namespace Events ==="
          kubectl get events -n seaweedfs --sort-by='.lastTimestamp'
          kubectl get events -n thehive --sort-by='.lastTimestamp'
          echo ""
          for component in master volume filer s3; do
            echo "=== SeaweedFS ${component} Logs ==="
            kubectl logs -n seaweedfs -l app.kubernetes.io/component="${component}" --tail=200 || true
            echo ""
          done
          echo "=== Cassandra Pod Logs ==="
          kubectl logs -n thehive -l app.kubernetes.io/name=cassandra --tail=200
          echo ""
          echo "=== ElasticSearch Pod Logs ==="
          kubectl logs -n thehive -l app.kubernetes.io/name=elasticsearch --tail=200
          echo ""
          echo "=== TheHive Deployment Events ==="
          kubectl describe deployment -n thehive -l app.kubernetes.io/name=thehive
          echo ""
          echo "=== TheHive Pod Logs ==="
          kubectl logs -n thehive -l app.kubernetes.io/name=thehive --tail=200
          echo ""
          echo "=== Test Pod Logs ==="
          kubectl logs -n thehive -l app.kubernetes.io/component=test --tail=100 || true

      - name: Cleanup
        if: always()
        run: |
          helm uninstall thehive --namespace thehive || true
          helm uninstall seaweedfs --namespace seaweedfs || true
          kubectl delete namespace thehive seaweedfs || true
