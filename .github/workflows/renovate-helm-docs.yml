name: Renovate Helm Docs

# Renovate (hosted Mend) bumps Chart.yaml appVersion/version but cannot run
# helm-docs itself (postUpgradeTasks are unavailable on the hosted app), so the
# README version/appVersion badges would drift out of sync. This regenerates the
# READMEs on Renovate PR branches and pushes the result.
#
# Pushes with a GitHub App token (BUMP_APP_ID / BUMP_APP_PRIVATE_KEY) so the
# docs commit re-triggers path-matching checks on the fixed commit — a push made
# with the default GITHUB_TOKEN would not. Runs ONLY for same-repo Renovate
# branches.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "thehive-charts/thehive/Chart.yaml"
      - "cortex-charts/cortex/Chart.yaml"

permissions:
  contents: write

jobs:
  helm-docs:
    if: >-
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install helm-docs (pinned, matches generate-helm-docs.yml)
        run: |
          cd /tmp
          wget -q https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xzf helm-docs_1.14.2_Linux_x86_64.tar.gz
          sudo mv helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      - name: Regenerate READMEs
        run: |
          set -euo pipefail
          (cd thehive-charts/thehive && helm-docs -t README.md.gotmpl .)
          (cd cortex-charts/cortex && helm-docs -t README.md.gotmpl .)

      - name: Commit and push if changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- thehive-charts/thehive/README.md cortex-charts/cortex/README.md; then
            echo "READMEs already in sync — nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add thehive-charts/thehive/README.md cortex-charts/cortex/README.md
          git commit -m "docs: regenerate helm-docs for Renovate image bump"
          git push origin "HEAD:${HEAD_REF}"
